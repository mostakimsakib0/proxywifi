<?xml version="1.0" encoding="UTF-8"?> <!-- -*- XML -*- -->
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  D-Bus system-bus policy for org.proxywifi.Daemon.

  Install as /usr/share/dbus-1/system.d/org.proxywifi.Daemon.conf and reload
  the bus (or reboot):

      sudo install -Dm644 packaging/dbus/org.proxywifi.Daemon.conf \
          /usr/share/dbus-1/system.d/org.proxywifi.Daemon.conf
      sudo systemctl reload dbus

  The stock system bus configuration already denies name ownership and
  outbound method calls for everyone, so the rules below only punch the holes
  the daemon and its clients need.

  NOTE: controlling the proxy means controlling the machine's traffic. Only
  members of the "proxywifi" group can reach the daemon:

      sudo groupadd -r proxywifi
      sudo usermod -aG proxywifi "$USER"
-->

<busconfig>

  <!-- The daemon itself runs as root. -->
  <policy user="root">
    <allow own="org.proxywifi.Daemon"/>
    <allow send_destination="org.proxywifi.Daemon"/>
    <allow receive_sender="org.proxywifi.Daemon"/>
  </policy>

  <!-- Unprivileged clients: the CLI today, the GTK4 GUI later. -->
  <policy group="proxywifi">
    <allow send_destination="org.proxywifi.Daemon"/>
    <allow receive_sender="org.proxywifi.Daemon"/>
  </policy>

  <!-- Everything else keeps the default-deny behaviour of the system bus. -->

</busconfig>
