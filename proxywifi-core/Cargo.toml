[package]
name = "proxywifi-core"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Core types, models, NetworkManager integration, and proxy profile management"

[lib]
name = "proxywifi_core"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
